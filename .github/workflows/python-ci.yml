name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      run_invariants:
        description: 'Run heavy invariants tests'
        required: false
        type: boolean
        default: false

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8
      
      - name: Run black
        run: black --check kineticstack tests
      
      - name: Run isort
        run: isort --check-only kineticstack tests
      
      - name: Run flake8
        run: flake8 kineticstack tests --max-line-length=100 --extend-ignore=E203,W503

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11']
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      
      - name: Run tests
        run: pytest tests/ -v --tb=short
      
      - name: Test import
        run: python -c "import kineticstack; print(f'KineticStack v{kineticstack.__version__}')"

  invariants:
    runs-on: ubuntu-latest
    if: github.event.inputs.run_invariants == 'true'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e .
      
      - name: Run invariants tests
        run: pytest tests/test_invariants.py -v --tb=short
      
      - name: Note about GPU hardware
        run: |
          echo "⚠️  Invariants tests run on CPU. For production validation,"
          echo "    run these tests on representative GPU hardware."
