<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Title -->
  <text x="400" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    KineticStack Architecture
  </text>
  
  <!-- Training Loop -->
  <rect x="300" y="60" width="200" height="60" rx="10" fill="#3498db" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="95" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    Training Loop
  </text>
  
  <!-- Arrow down -->
  <path d="M 400 120 L 400 160" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Telemetry Monitor -->
  <rect x="250" y="160" width="300" height="80" rx="10" fill="#2ecc71" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="190" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    TelemetryMonitor
  </text>
  <text x="400" y="210" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    GPU Metrics (pynvml)
  </text>
  <text x="400" y="225" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Memory: 50% | Util: 75%
  </text>
  
  <!-- GPU Icon -->
  <circle cx="600" cy="200" r="30" fill="#34495e" stroke="#2c3e50" stroke-width="2"/>
  <text x="600" y="210" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    GPU
  </text>
  <path d="M 550 200 L 570 200" stroke="#e74c3c" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrowhead-red)"/>
  
  <!-- Decision Diamond -->
  <path d="M 400 240 L 350 280 L 400 320 L 450 280 Z" fill="#f39c12" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Threshold
  </text>
  <text x="400" y="300" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="white">
    Exceeded?
  </text>
  
  <!-- Arrow to Sculptor -->
  <path d="M 400 320 L 400 350" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="420" y="340" font-family="Arial, sans-serif" font-size="11" fill="#27ae60" font-weight="bold">
    YES
  </text>
  
  <!-- Sculptor Executor -->
  <rect x="200" y="350" width="400" height="100" rx="10" fill="#9b59b6" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="380" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    SculptorExecutor (Agentic AI)
  </text>
  <rect x="220" y="390" width="160" height="50" rx="5" fill="#8e44ad" stroke="white" stroke-width="1"/>
  <text x="300" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Reason:
  </text>
  <text x="300" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Analyze torch.fx
  </text>
  
  <rect x="420" y="390" width="160" height="50" rx="5" fill="#8e44ad" stroke="white" stroke-width="1"/>
  <text x="500" y="410" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Execute:
  </text>
  <text x="500" y="425" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Inject Checkpoint
  </text>
  
  <!-- Arrow to Invariants -->
  <path d="M 400 450 L 400 480" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Invariants -->
  <rect x="250" y="480" width="300" height="70" rx="10" fill="#e74c3c" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="505" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">
    @verify_invariant
  </text>
  <text x="400" y="525" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="white">
    Measure p99 latency
  </text>
  <text x="400" y="540" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    Enforce &lt; threshold
  </text>
  
  <!-- Arrow to Production -->
  <path d="M 400 550 L 400 580" stroke="#2c3e50" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  
  <!-- Production -->
  <rect x="300" y="580" width="200" height="50" rx="10" fill="#16a085" stroke="#2c3e50" stroke-width="2"/>
  <text x="400" y="600" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white">
    Apply to Production
  </text>
  <text x="400" y="618" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" fill="white">
    ✓ Safe Changes
  </text>
  
  <!-- Legend -->
  <rect x="20" y="350" width="150" height="120" rx="5" fill="#ecf0f1" stroke="#2c3e50" stroke-width="1"/>
  <text x="95" y="370" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#2c3e50">
    Components
  </text>
  <rect x="30" y="380" width="20" height="15" fill="#2ecc71"/>
  <text x="55" y="392" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Telemetry</text>
  <rect x="30" y="400" width="20" height="15" fill="#9b59b6"/>
  <text x="55" y="412" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Agent</text>
  <rect x="30" y="420" width="20" height="15" fill="#e74c3c"/>
  <text x="55" y="432" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Invariants</text>
  <rect x="30" y="440" width="20" height="15" fill="#16a085"/>
  <text x="55" y="452" font-family="Arial, sans-serif" font-size="10" fill="#2c3e50">Production</text>
  
  <!-- Feedback Loop Arrow -->
  <path d="M 500 615 L 650 615 L 650 90 L 500 90" stroke="#95a5a6" stroke-width="3" stroke-dasharray="10,5" fill="none" marker-end="url(#arrowhead-gray)"/>
  <text x="660" y="350" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d" font-weight="bold" transform="rotate(90 660 350)">
    Continuous Feedback Loop
  </text>
  
  <!-- Arrow definitions -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#2c3e50"/>
    </marker>
    <marker id="arrowhead-red" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#e74c3c"/>
    </marker>
    <marker id="arrowhead-gray" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#95a5a6"/>
    </marker>
  </defs>
</svg>
