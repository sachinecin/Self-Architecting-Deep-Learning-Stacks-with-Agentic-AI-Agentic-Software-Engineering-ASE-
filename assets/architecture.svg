<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="400" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#212529">
    KineticStack Architecture
  </text>
  <text x="400" y="55" font-size="14" text-anchor="middle" fill="#6c757d">
    Telemetry-Driven Agentic Optimization Loop
  </text>

  <!-- Telemetry Collector -->
  <rect x="50" y="100" width="180" height="80" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="140" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#1565c0">
    TelemetryCollector
  </text>
  <text x="140" y="150" font-size="12" text-anchor="middle" fill="#424242">
    NVML GPU Metrics
  </text>
  <text x="140" y="165" font-size="11" text-anchor="middle" fill="#616161">
    HBM, Temp, Power
  </text>

  <!-- Arrow 1: Telemetry to Manager -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#495057"/>
    </marker>
  </defs>
  <line x1="230" y1="140" x2="300" y2="140" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="265" y="135" font-size="10" text-anchor="middle" fill="#495057">metrics</text>

  <!-- Stack Manager -->
  <rect x="300" y="100" width="180" height="80" rx="8" fill="#fff3e0" stroke="#f57c00" stroke-width="2"/>
  <text x="390" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#e65100">
    StackManager
  </text>
  <text x="390" y="150" font-size="12" text-anchor="middle" fill="#424242">
    Decision Logic
  </text>
  <text x="390" y="165" font-size="11" text-anchor="middle" fill="#616161">
    Orchestration
  </text>

  <!-- Arrow 2: Manager to Sculptor -->
  <line x1="390" y1="180" x2="390" y2="250" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="215" font-size="10" fill="#495057">HBM &gt;85%</text>
  <text x="410" y="228" font-size="10" fill="#495057">for &gt;5s</text>

  <!-- Sculptor Executor -->
  <rect x="300" y="250" width="180" height="80" rx="8" fill="#e8f5e9" stroke="#388e3c" stroke-width="2"/>
  <text x="390" y="280" font-size="16" font-weight="bold" text-anchor="middle" fill="#2e7d32">
    SculptorExecutor
  </text>
  <text x="390" y="300" font-size="12" text-anchor="middle" fill="#424242">
    torch.fx Transform
  </text>
  <text x="390" y="315" font-size="11" text-anchor="middle" fill="#616161">
    Activation Checkpoint
  </text>

  <!-- Arrow 3: Sculptor to Invariants -->
  <line x1="390" y1="330" x2="390" y2="400" stroke="#495057" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="410" y="365" font-size="10" fill="#495057">verify</text>

  <!-- Invariant Verifier -->
  <rect x="300" y="400" width="180" height="80" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="390" y="430" font-size="16" font-weight="bold" text-anchor="middle" fill="#ad1457">
    InvariantVerifier
  </text>
  <text x="390" y="450" font-size="12" text-anchor="middle" fill="#424242">
    P99 Latency Check
  </text>
  <text x="390" y="465" font-size="11" text-anchor="middle" fill="#616161">
    Tolerance &lt;15%
  </text>

  <!-- Arrow 4: Feedback loop -->
  <path d="M 480 440 L 550 440 L 550 140 L 480 140" stroke="#28a745" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
  <text x="560" y="290" font-size="10" fill="#28a745" transform="rotate(90 560 290)">
    PASS
  </text>

  <!-- Legend Box -->
  <rect x="550" y="100" width="230" height="380" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="665" y="130" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">
    Key Features
  </text>

  <!-- Feature 1 -->
  <circle cx="570" cy="160" r="5" fill="#1976d2"/>
  <text x="585" y="165" font-size="11" fill="#212529">
    Real-time NVML telemetry
  </text>

  <!-- Feature 2 -->
  <circle cx="570" cy="185" r="5" fill="#f57c00"/>
  <text x="585" y="190" font-size="11" fill="#212529">
    Agentic decision loop
  </text>

  <!-- Feature 3 -->
  <circle cx="570" cy="210" r="5" fill="#388e3c"/>
  <text x="585" y="215" font-size="11" fill="#212529">
    Selective checkpointing
  </text>

  <!-- Feature 4 -->
  <circle cx="570" cy="235" r="5" fill="#c2185b"/>
  <text x="585" y="240" font-size="11" fill="#212529">
    P99 invariant protection
  </text>

  <!-- Dependencies -->
  <line x1="560" y1="265" x2="770" y2="265" stroke="#dee2e6" stroke-width="1"/>
  <text x="665" y="290" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">
    Dependencies
  </text>

  <text x="565" y="315" font-size="11" fill="#495057">• PyTorch ≥2.1,&lt;3.0</text>
  <text x="565" y="335" font-size="11" fill="#495057">• Triton ≥2.0,&lt;3.0</text>
  <text x="565" y="355" font-size="11" fill="#495057">• pynvml ≥11.0</text>

  <!-- CI/Testing -->
  <line x1="560" y1="375" x2="770" y2="375" stroke="#dee2e6" stroke-width="1"/>
  <text x="665" y="400" font-size="14" font-weight="bold" text-anchor="middle" fill="#212529">
    Testing
  </text>

  <text x="565" y="420" font-size="10" fill="#495057">✓ Mocked NVML for CI</text>
  <text x="565" y="437" font-size="10" fill="#495057">✓ CPU-only runners</text>
  <text x="565" y="454" font-size="10" fill="#dc3545">⚠ GPU benchmarks gated</text>
  <text x="565" y="471" font-size="10" fill="#495057">  (representative hardware)</text>

  <!-- Footer -->
  <text x="400" y="570" font-size="11" text-anchor="middle" fill="#6c757d">
    Experimental ASE Framework • Telemetry-Driven Optimization
  </text>
</svg>
