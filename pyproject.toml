[tool.poetry]
name = "kineticstack"
version = "0.1.0"
description = "KineticStack — foundation for self-architecting deep learning stacks"
authors = ["sachinecin <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
# Core runtime dependencies requested:
torch = "*"
triton = "*"
pynvml = "*"

[tool.poetry.dev-dependencies]
pytest = "^7.0"
black = "^24.0"
isort = "^6.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"