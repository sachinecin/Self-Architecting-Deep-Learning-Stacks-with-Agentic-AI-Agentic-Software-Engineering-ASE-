[tool.poetry]
name = "kineticstack"
version = "0.1.0"
description = "Self-Architecting Deep Learning Stack with Agentic AI"
authors = ["KineticStack Team"]
readme = "README.md"
packages = [{include = "kineticstack"}]

[tool.poetry.dependencies]
python = "^3.8"
torch = ">=2.1,<3.0"
triton = ">=2.0,<3.0"
pynvml = ">=11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
black = "^23.0"
isort = "^5.12"
flake8 = "^6.0"
pre-commit = "^3.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
