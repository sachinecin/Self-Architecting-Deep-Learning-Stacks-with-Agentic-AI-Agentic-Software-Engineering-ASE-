[tool.poetry]
name = "kineticstack"
version = "0.1.0"
description = "Telemetry-driven agentic loop for deep learning stack optimization with selective activation checkpointing"
authors = ["KineticStack Team"]
readme = "README.md"
packages = [{include = "kineticstack"}]

[tool.poetry.dependencies]
python = "^3.9"
torch = ">=2.1,<3.0"
triton = ">=2.0,<3.0"
pynvml = ">=11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
black = "^23.7.0"
ruff = "^0.0.282"
mypy = "^1.4.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py39']

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=kineticstack --cov-report=term-missing"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
